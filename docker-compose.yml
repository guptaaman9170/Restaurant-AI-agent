services:
  # Database Service (MongoDB)
  mongo:
    image: mongo:7-jammy
    container_name: restaurant-ai-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend Service (Node.js + Express + LangGraph)
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: restaurant-ai-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-5000}:5000"
    environment:
      PORT: 5000
      NODE_ENV: ${NODE_ENV:-production}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/restaurant-agent}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SEARCH_API_KEY: ${SEARCH_API_KEY}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3000,http://localhost:5173}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Frontend Service (React + Vite + Nginx Reverse Proxy)
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: restaurant-ai-client
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - restaurant-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
    driver: local

networks:
  restaurant-network:
    driver: bridge
