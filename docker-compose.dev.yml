# Development Compose Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      NODE_ENV: development
    volumes:
      - ./server:/app
      - /app/node_modules

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    # In dev mode, run Vite dev server directly on port 5173
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./client:/app
      - /app/node_modules
